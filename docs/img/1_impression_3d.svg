  <rect x="55" y="140" width="90" height="10" rx="3" fill="#FFFFFF"/>
  <!-- printer gantry -->
  <rect x="55" y="45" width="8" height="95" rx="3" fill="#FFFFFF"/>
  <rect x="137" y="45" width="8" height="95" rx="3" fill="#FFFFFF"/>
