<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" rx="28" fill="#C1272D"/>
  <!-- emitter head -->
  <rect x="80" y="40" width="40" height="26" rx="4" fill="#FFFFFF"/>
  <rect x="92" y="66" width="16" height="14" fill="#FFFFFF"/>
  <!-- beam -->
  <line x1="100" y1="80" x2="100" y2="140" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- material plate being cut -->
  <rect x="45" y="140" width="110" height="12" rx="3" fill="#FFFFFF"/>
  <!-- cut line / spark burst -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="140" x2="86" y2="158"/>
    <line x1="100" y1="140" x2="114" y2="158"/>
    <line x1="100" y1="140" x2="100" y2="162"/>
  </g>
</svg>
